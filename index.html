<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>memory books</title>
</head>
<!-- Link para o arquivo de estilização do CSS -->
<link rel="stylesheet" href="css/styles.css">

<body>   
  

  <!-- Início do container principal -->
  <section class="memory-game">    
  
    <!-- Início das seções dos cards - 12 cards (cartões)-->
    <section class="memory-card-books" data-framework="garret">
      <!-- O que são Data Attributes?
        São atributos criados por você no HTML para guardar informações extras em uma tag 
        sem precisar criar classes ou IDs.Exemplo no HTML:<div data-status="ativo" 
        data-cor="azul">Texto</div>-->
      <img class="front-face" src="img/TRAS CARD.png" alt="o acordo" />
      <img class="back-face" src="img/garret.png" alt="hannah" />
    </section>

    <section class="memory-card-books" data-framework="hannah">
      <img class="front-face" src="img/TRAS CARD.png" alt="o acordo" />
      <img class="back-face" src="img/hannah.png" alt="garret" />
    </section>

    <section class="memory-card-books" data-framework="violetpronta">
      <img class="front-face" src="img/TRAS CARD.png" alt="quartaasa" />
      <img class="back-face" src="img/violetpronta.png" alt="xadenpronto" />
    </section>

    <section class="memory-card-books" data-framework="judepronta">
      <img class="front-face" src="img/TRAS CARD.png" alt="princepecruel" />
      <img class="back-face" src="img/judepronta.png" alt="cardampronto" />
    </section>

    <section class="memory-card-books" data-framework="adam">
      <img class="front-face" src="img/TRAS CARD.png" alt="hipotesedoamor" />
      <img class="back-face" src="img/adam.jpg" alt="oliviesmit" />
    </section>

    <section class="memory-card-books" data-framework="Xadenpronto">
      <img class="front-face" src="img/TRAS CARD.png" alt="quartaasa" />
      <img class="back-face" src="img/xadenpronto.png" alt="violetpronta" />
    </section>

    <section class="memory-card-books" data-framework="powerlesspronto">
      <img class="front-face" src="img/TRAS CARD.png" alt="powerless" />
      <img class="back-face" src="img/powerlesspronto.png" alt="kai" />
    </section>

    <section class="memory-card-books" data-framework="oliviesmit">
      <img class="front-face" src="img/TRAS CARD.png" alt="hipotesedoamor" />
      <img class="back-face" src="img/oliviesmit.jpg" alt="adam" />
    </section>

    <section class="memory-card-books" data-framework="cardampronto">
      <img class="front-face" src="img/TRAS CARD.png" alt="princepecruel" />
      <img class="back-face" src="img/cardampronto.png" alt="judepronta" />
    </section>

    <section class="memory-card-books" data-framework="evie">
      <img class="front-face" src="img/TRAS CARD.png" alt="assistentedovillao" />
      <img class="back-face" src="img/evie.png" alt="tristan" />
    </section>

    <section class="memory-card-books" data-framework="tristan">
      <img class="front-face" src="img/TRAS CARD.png" alt="assistentedovillao" />
      <img class="back-face" src="img/tristan.png" alt="evie" />
    </section>
    <!-- Fim das seções dos cards-->

  </section>
  <!-- Fim do container principal -->

  <!-- Link para o arquivo Javascript, que será iniciado na próxima semana -->
  <script src="js/scripts.js"></script>
</body>
</html>
